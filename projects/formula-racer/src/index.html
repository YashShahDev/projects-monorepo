<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formula Racer</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./app/styles.css" />
    <script type="module" src="./app/main.ts"></script>
  </head>
  <body>
    <canvas id="view" aria-label="Race view"></canvas>
    <svg id="track-map" aria-label="Track map" role="img"></svg>
    <div id="corner-preview" aria-label="Next corner" aria-live="polite" hidden></div>
    <div id="hud" aria-label="Car">
      <div id="telemetry" aria-label="Telemetry"></div>
      <span id="speed">0</span> <span class="unit">km/h</span> <span class="gear-label">Gear</span>
      <span id="gear">1</span>
      <div id="energy">
        <span id="energy-mode">Balanced</span>
        <meter id="charge-meter" aria-label="Battery" min="0" max="100" low="20" optimum="100" value="100"></meter>
        <span id="charge">100%</span> <span id="ers">0 kW</span>
        <span id="wing">Corner</span>
      </div>
    </div>
    <div id="timing" aria-label="Lap timing">
      <span id="track-name"></span>
      <span class="label">Lap</span> <span id="lap-time">–</span> <span class="label">Last</span>
      <span id="last-lap">–</span> <span class="label">Best</span> <span id="best-lap">–</span>
      <span id="delta" hidden></span>
      <p id="storage-note" hidden></p>
    </div>
    <div id="countdown" aria-live="assertive"></div>
    <div id="paused" role="dialog" aria-label="Paused" hidden>
      <header>
        <h2>Paused</h2>
        <p class="hint">Press <kbd>Esc</kbd> to resume · <kbd>H</kbd> for controls</p>
      </header>
      <div class="actions">
        <button id="resume" class="primary" type="button">Resume</button>
        <button id="restart" type="button">Restart</button>
        <button id="controls" type="button">Controls</button>
      </div>
      <section aria-labelledby="menu-driving">
        <h3 id="menu-driving">Driving</h3>
        <label class="row"
          >Gearbox
          <select id="gearbox">
            <option value="automatic">Automatic</option>
            <option value="hybrid">Hybrid (auto + manual)</option>
            <option value="manual">Manual</option>
          </select></label
        >
        <label class="row"
          >Racing line
          <select id="racing-line">
            <option value="off">Off</option>
            <option value="braking">Braking zones</option>
            <option value="full">Full</option>
          </select></label
        >
        <label class="row"
          >Ghost
          <select id="ghost">
            <option value="off">Off</option>
            <option value="best">Best lap</option>
            <option value="last">Last lap</option>
          </select></label
        >
      </section>
      <section aria-labelledby="menu-assists">
        <h3 id="menu-assists">Assists <span class="note">changing one restarts the lap</span></h3>
        <label class="switch"><input id="assist-steering" type="checkbox" checked /> Steering assist</label>
        <label class="switch"><input id="assist-abs" type="checkbox" checked /> ABS</label>
        <label class="switch"><input id="assist-traction" type="checkbox" checked /> Traction control</label>
      </section>
      <section aria-labelledby="menu-display">
        <h3 id="menu-display">Display</h3>
        <label class="row"
          >Livery
          <select id="livery"></select
        ></label>
        <label class="row"
          >Graphics
          <select id="quality"></select
        ></label>
      </section>
      <section aria-labelledby="menu-audio">
        <h3 id="menu-audio">Audio</h3>
        <label class="switch"><input id="sound" type="checkbox" checked /> Sound</label>
      </section>
    </div>
    <div id="help" role="dialog" aria-label="Controls" hidden>
      <h2>Controls</h2>
      <table id="help-table"></table>
      <button id="help-close" type="button">Close</button>
    </div>
    <div id="status" role="status">Loading…</div>
  </body>
</html>
