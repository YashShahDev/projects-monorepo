<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formula Racer</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./app/styles.css" />
    <script type="module" src="./app/main.ts"></script>
  </head>
  <body>
    <canvas id="view" aria-label="Race view"></canvas>
    <svg id="track-map" aria-label="Track map" role="img"></svg>
    <div id="corner-preview" aria-label="Next corner" aria-live="polite" hidden></div>
    <div id="hud" aria-label="Car">
      <div id="telemetry" aria-label="Telemetry"></div>
      <span id="speed">0</span> <span class="unit">km/h</span> <span class="gear-label">Gear</span>
      <span id="gear">1</span>
      <div id="energy">
        <span id="energy-mode">Balanced</span>
        <meter id="charge-meter" aria-label="Battery" min="0" max="100" low="20" optimum="100" value="100"></meter>
        <span id="charge">100%</span> <span id="ers">0 kW</span>
        <span id="wing">Corner</span>
      </div>
    </div>
    <div id="timing" aria-label="Lap timing">
      <span id="track-name"></span>
      <span class="label">Lap</span> <span id="lap-time">–</span> <span class="label">Last</span>
      <span id="last-lap">–</span> <span class="label">Best</span> <span id="best-lap">–</span>
      <p id="storage-note" hidden></p>
    </div>
    <div id="countdown" aria-live="assertive"></div>
    <div id="paused" role="dialog" aria-label="Paused" hidden>
      <h2>Paused</h2>
      <button id="resume" type="button">Resume</button>
      <button id="restart" type="button">Restart</button>
      <fieldset>
        <legend>Assists (changing one restarts the lap)</legend>
        <label><input id="assist-steering" type="checkbox" checked /> Steering assist</label>
        <label><input id="assist-abs" type="checkbox" checked /> ABS</label>
        <label><input id="assist-traction" type="checkbox" checked /> Traction control</label>
      </fieldset>
      <label
        >Livery
        <select id="livery"></select
      ></label>
      <label
        >Gearbox
        <select id="gearbox">
          <option value="automatic">Automatic</option>
          <option value="hybrid">Hybrid (auto + manual)</option>
          <option value="manual">Manual</option>
        </select></label
      >
      <label
        >Graphics
        <select id="quality"></select
      ></label>
      <label><input id="sound" type="checkbox" checked /> Sound</label>
      <p class="hint">Esc resume · R restart · Z/X gear down/up · Shift deploy · E energy mode · C camera</p>
    </div>
    <div id="status" role="status">Loading…</div>
  </body>
</html>
